<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <style>
    /* ==========================================================================
       DONATION WIDGET STYLES (Smooth Pink Theme)
       ========================================================================== */
    .donation-widget {
      max-width: 550px;
      margin: 40px auto;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      font-family: 'Sarabun', sans-serif;
    }

    /* 1. SMOOTH TOGGLE SWITCH */
    .donate-toggle {
      display: flex;
      position: relative;
      background: #f0f0f0;
      border-radius: 50px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .donate-toggle input {
      display: none;
    }

    .donate-toggle label {
      flex: 1;
      text-align: center;
      padding: 14px;
      cursor: pointer;
      z-index: 2;
      font-weight: 600;
      color: #666;
      transition: color 0.3s ease;
    }

    /* The sliding pink background */
    .toggle-slider {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: #e91e63;
      border-radius: 50px;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 1;
    }

    /* Logic for slider movement and text color change */
    #onetime:checked ~ .toggle-slider { transform: translateX(0); }
    #monthly:checked ~ .toggle-slider { transform: translateX(100%); }
    
    #onetime:checked ~ label[for="onetime"],
    #monthly:checked ~ label[for="monthly"] {
      color: #ffffff;
    }

    /* 2. DONATION AMOUNTS (Placeholder for visual context) */
    .amount-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .amount-btn {
      padding: 12px;
      text-align: center;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .amount-btn:hover { border-color: #e91e63; color: #e91e63; }

    /* 3. TAX INVOICE SECTION (Smooth Expand/Collapse) */
    .tax-section {
      border-top: 2px dashed #eee;
      padding-top: 20px;
      margin-top: 20px;
    }

    .tax-checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      user-select: none;
    }

    .tax-checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #e91e63;
      cursor: pointer;
    }

    /* Hidden state */
    .tax-form {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), opacity 0.4s ease;
    }

    /* Visible state triggered via JS */
    .tax-form.open {
      max-height: 600px; /* arbitrary large height to allow transition */
      opacity: 1;
      transition: max-height 0.5s ease-in-out, opacity 0.5s ease-in-out;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: #e91e63;
    }
    
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    
    .submit-btn:hover { background: #c2185b; }
  </style>
</head>
<body>

  <div class="donation-widget">
    
    <div class="donate-toggle">
      <input type="radio" id="onetime" name="donate-type" checked>
      <input type="radio" id="monthly" name="donate-type">
      
      <div class="toggle-slider"></div>
      
      <label for="onetime">บริจาคครั้งเดียว</label>
      <label for="monthly">บริจาครายเดือน</label>
    </div>

    <div class="amount-grid">
      <div class="amount-btn">500 ฿</div>
      <div class="amount-btn">1,000 ฿</div>
      <div class="amount-btn">ระบุจำนวนเงิน</div>
    </div>

    <div class="tax-section">
      <label class="tax-checkbox-wrapper">
        <input type="checkbox" id="request-tax">
        <span>ต้องการขอรับใบกำกับภาษี (เพื่อลดหย่อนภาษี)</span>
      </label>
      
      <div class="tax-form" id="tax-form-fields">
        <div class="form-group">
          <input type="text" name="tax_name" placeholder="ชื่อ-นามสกุล / ชื่อบริษัท (ตามบัตรประชาชน/ภ.พ.20)">
        </div>
        <div class="form-group">
          <input type="text" name="tax_id_card" placeholder="เลขประจำตัวประชาชน (13 หลัก)" maxlength="13" pattern="\d{13}">
        </div>
        <div class="form-group">
          <input type="text" name="tax_taxpayer_id" placeholder="เลขประจำตัวผู้เสียภาษี (ถ้ามี)" maxlength="13">
        </div>
        <div class="form-group">
          <textarea name="tax_address" placeholder="ที่อยู่สำหรับออกใบกำกับภาษี..." rows="3"></textarea>
        </div>
      </div>
    </div>
    
    <button class="submit-btn">ดำเนินการบริจาค</button>
  </div>

  <script>
    // JS to toggle the smooth drop-down for the tax form
    const taxCheckbox = document.getElementById('request-tax');
    const taxForm = document.getElementById('tax-form-fields');

    taxCheckbox.addEventListener('change', function() {
      if (this.checked) {
        taxForm.classList.add('open');
        
        // Optional: Auto-focus the first field when it opens
        setTimeout(() => {
          taxForm.querySelector('input').focus();
        }, 100); 
      } else {
        taxForm.classList.remove('open');
      }
    });
  </script>

</body>
</html>
